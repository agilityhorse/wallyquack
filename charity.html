<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wall Quack – Charity</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap");

      body {
        margin: 0;
        font-family: "Press Start 2P", monospace;
        background: #171a1a;
        color: #e6e6e6;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        max-width: 320px;
        margin-left: auto;
        margin-right: auto;
      }

      .logo {
        max-width: 200px;
        margin-bottom: 30px;
      }

      #counter {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 20px;
        font-size: 11px;
        color: #fec24d;
      }

      #counter img {
        width: 20px;
        height: 20px;
      }

      .image-box {
        width: 316px;
        height: 105px;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 15px;
        background: #0f1111;
      }

      .image-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      p.description {
        font-family: Arial, sans-serif;
        font-size: 11px;
        line-height: 1.4;
        margin-bottom: 20px;
      }

      .btn {
        background: #fec24d;
        color: #7e17e6;
        padding: 12px 20px;
        border-radius: 6px;
        font-weight: bold;
        font-size: 16px;
        text-decoration: none;
        margin: 15px 0 10px 0;
        display: inline-block;
        cursor: pointer;
        text-align: center;
      }

      .back-link {
        color: #fec24d;
        font-family: Arial, sans-serif;
        font-size: 11px;
        text-decoration: none;
        margin-bottom: 20px;
        display: inline-block;
      }

      .footer {
        margin-top: 20px;
        font-size: 11px;
        font-family: Arial, sans-serif;
        text-align: center;
      }

      /* ==============================
         GAME SCREEN – FIXED FOR MOBILE
         ============================== */
      #game-screen {
        display: none;
        width: 100%;
        max-width: 320px;
        background: black;
        position: relative;

        /* Dynamic height based on screen width: ratio 1:2 */
        height: calc(100vw * 2);
        max-height: 640px; /* stops from growing too large */
      }

      #game-screen iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      #back-btn {
        position: absolute;
        top: 6px;
        left: 6px;
        background: #fec24d;
        color: #7e17e6;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 10px;
        cursor: pointer;
        z-index: 20;
      }
    </style>
  </head>

  <body>
    <div id="main-content">
      <img src="images/logo.png" alt="Logo" class="logo" />

      <div id="counter">
        <img src="images/coin.png" alt="coin" />
        <span id="counter-value">0/50 $</span>
      </div>

      <div class="image-box">
        <img src="images/donation-image.png" alt="Charity banner" />
      </div>

      <p class="description">
        The game <strong>Wally Quack</strong> combines entertainment with
        helping the needy. <br /><br />
        Every "game win" is a one dollar gifted to
        <strong>International Bird Rescue</strong>, a foundation that take care
        of ducks.
      </p>

      <div class="btn" id="play-btn">TAKE A CHALLENGE</div>

      <a href="index.html" class="back-link">← Back to Home</a>

      <div class="footer">
        I hope you will hate my game.<br />
        <a href="https://x.com/AgilityHorse" target="_blank">Agility Horse</a>
        &nbsp;•&nbsp;
        <a href="https://www.birdrescue.org" target="_blank">
          International Bird Rescue
        </a>
      </div>
    </div>

    <!-- GAME VIEW -->
    <div id="game-screen">
      <div id="back-btn">BACK</div>
      <iframe
        src="https://itch.io/embed-upload/15551688?color=333333"
        allow="fullscreen"
      ></iframe>
    </div>

    <script>
      const SUPABASE_URL = "https://uolddxujywmgixfsruan.supabase.co";
      const SUPABASE_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVvbGRkeHVqeXdtZ2l4ZnNydWFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMxODg0MDgsImV4cCI6MjA3ODc2NDQwOH0._vD1dj34aSdArobcYB9cDsgG8wpHve27FYHS7pyjtgc";

      async function loadCoins() {
        try {
          const res = await fetch(
            `${SUPABASE_URL}/rest/v1/game_completions?select=id`,
            {
              method: "GET",
              headers: {
                apiKey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`,
                Prefer: "count=exact",
              },
            }
          );

          const total = res.headers.get("content-range")
            ? parseInt(res.headers.get("content-range").split("/")[1])
            : 0;

          document.getElementById(
            "counter-value"
          ).textContent = `${total}/50 $`;
        } catch (err) {
          console.error("Coin fetch error", err);
        }
      }

      loadCoins();

      /* SHOW GAME */
      const playBtn = document.getElementById("play-btn");
      const mainContent = document.getElementById("main-content");
      const gameScreen = document.getElementById("game-screen");
      const backBtn = document.getElementById("back-btn");

      playBtn.addEventListener("click", () => {
        mainContent.style.display = "none";
        gameScreen.style.display = "block";
        window.scrollTo(0, 0); // always scroll to top
      });

      backBtn.addEventListener("click", () => {
        gameScreen.style.display = "none";
        mainContent.style.display = "block";
        window.scrollTo(0, 0);
      });
    </script>
  </body>
</html>
