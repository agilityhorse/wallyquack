<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add Score</title>
  </head>
  <body>
    <h1>Submit Your Score</h1>

    <form id="scoreForm">
      <label for="nick">Nick:</label>
      <input type="text" id="nick" required />
      <input type="hidden" id="token" />
      <input type="hidden" id="score" />
      <input type="hidden" id="attempts" />
      <button type="submit">Submit</button>
    </form>

    <script>
      const ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZreGtjcmttcGN4bHN2dXN3ZGN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1NDA4ODksImV4cCI6MjA4NTExNjg4OX0.kamL2caQJQ1GGNHb-ftFi1L-4urZoqLfbO6WC7zfWjI";

      // --- Pobranie tokenu i wyników z URL ---
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");
      const score = parseInt(params.get("score")) || 0;
      const attempts = parseInt(params.get("attempts")) || 0;

      if (!token) {
        alert("Brak tokenu! Nie możesz dodać wyniku.");
        document.getElementById("scoreForm").style.display = "none";
      } else {
        document.getElementById("token").value = token;
        document.getElementById("score").value = score;
        document.getElementById("attempts").value = attempts;
      }

      document
        .getElementById("scoreForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const nick = document.getElementById("nick").value.trim();
          if (!nick) return alert("Podaj nick!");

          try {
            // --- POST do Supabase scores ---
            const response = await fetch(
              "https://fkxkcrkmpcxlsvuswdct.supabase.co/rest/v1/scores",
              {
                method: "POST",
                headers: {
                  apikey: ANON_KEY,
                  Authorization: "Bearer " + ANON_KEY,
                  "Content-Type": "application/json",
                  Prefer: "return=representation",
                },
                body: JSON.stringify({
                  playernick: nick,
                  score: score,
                  attempts: attempts,
                  token: token,
                }),
              },
            );

            if (!response.ok) {
              const err = await response.json();
              return alert(
                "Błąd przy dodawaniu wyniku: " + JSON.stringify(err),
              );
            }

            alert("Wynik dodany pomyślnie!");

            // --- PATCH token na used=true ---
            const patchResp = await fetch(
              `https://fkxkcrkmpcxlsvuswdct.supabase.co/rest/v1/tokens?token=eq.${token}`,
              {
                method: "PATCH",
                headers: {
                  apikey: ANON_KEY,
                  Authorization: "Bearer " + ANON_KEY,
                  "Content-Type": "application/json",
                  Prefer: "return=representation",
                },
                body: JSON.stringify({ used: true }),
              },
            );

            if (!patchResp.ok) {
              console.warn("Nie udało się oznaczyć tokenu jako użytego.");
            }
          } catch (err) {
            console.error(err);
            alert("Błąd sieci lub klucza API: sprawdź konsolę.");
          }
        });
    </script>
  </body>
</html>
