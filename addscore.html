<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wally Quack – Submit Score</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #181a17;
        color: #e6e6e6;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
      }

      .container {
        width: 320px;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }

      .logo {
        width: 100%;
        max-width: 320px;
        margin: 0 auto 20px auto;
      }

      h1 {
        font-size: 18px;
        margin-bottom: 16px;
        color: #e6e617;
      }

      .description {
        font-size: 14px;
        margin-bottom: 20px;
        line-height: 1.4;
      }

      input[type="text"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 16px;
        border-radius: 6px;
        border: none;
        font-size: 14px;
        box-sizing: border-box;
      }

      .submit-button {
        display: inline-block;
        padding: 12px 24px;
        background-color: #e6e617;
        color: #181a17;
        text-decoration: none;
        font-weight: bold;
        border-radius: 6px;
        border: none;
        font-size: 16px;
        cursor: pointer;
      }

      .submit-button:hover {
        opacity: 0.9;
      }

      .error {
        color: #ff6666;
        font-size: 13px;
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <img src="images/logo1.png" alt="Wally Quack Logo" class="logo" />

      <h1>Submit Your Score</h1>

      <div class="description">
        Enter your nickname to save your result<br />
        and join the <b>Best Pipes Bangers</b>.
      </div>

      <form id="scoreForm">
        <input
          type="text"
          id="nick"
          placeholder="Your nickname"
          maxlength="20"
          required
        />

        <input type="hidden" id="token" />
        <input type="hidden" id="score" />
        <input type="hidden" id="attempts" />
        <input type="hidden" id="pipes" />

        <button type="submit" class="submit-button">Submit Score</button>
      </form>

      <div id="error" class="error"></div>
    </div>

    <script>
      const ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZreGtjcmttcGN4bHN2dXN3ZGN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1NDA4ODksImV4cCI6MjA4NTExNjg4OX0.kamL2caQJQ1GGNHb-ftFi1L-4urZoqLfbO6WC7zfWjI";

      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");
      const score = parseInt(params.get("score")) || 0;
      const attempts = parseInt(params.get("attempts")) || 0;
      const pipes = parseInt(params.get("pipes")) || 0;

      const errorEl = document.getElementById("error");
      const form = document.getElementById("scoreForm");

      if (!token) {
        errorEl.textContent = "No token provided. You cannot submit a score.";
        form.style.display = "none";
      } else {
        document.getElementById("token").value = token;
        document.getElementById("score").value = score;
        document.getElementById("attempts").value = attempts;
        document.getElementById("pipes").value = pipes;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const nick = document.getElementById("nick").value.trim();
        if (!nick) {
          errorEl.textContent = "Please enter your nickname.";
          return;
        }

        try {
          const response = await fetch(
            "https://fkxkcrkmpcxlsvuswdct.supabase.co/rest/v1/scores",
            {
              method: "POST",
              headers: {
                apikey: ANON_KEY,
                Authorization: "Bearer " + ANON_KEY,
                "Content-Type": "application/json",
                Prefer: "return=representation",
              },
              body: JSON.stringify({
                playernick: nick,
                score,
                attempts,
                pipes,
                token,
              }),
            },
          );

          if (!response.ok) {
            const err = await response.json();
            errorEl.textContent =
              "Error submitting score: " + JSON.stringify(err);
            return;
          }

          await fetch(
            `https://fkxkcrkmpcxlsvuswdct.supabase.co/rest/v1/tokens?token=eq.${token}`,
            {
              method: "PATCH",
              headers: {
                apikey: ANON_KEY,
                Authorization: "Bearer " + ANON_KEY,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ used: true }),
            },
          );

          window.location.href = "https://www.wallyquack.com/game/index.html";
        } catch (err) {
          console.error(err);
          errorEl.textContent = "Network or API error.";
        }
      });
    </script>
  </body>
</html>
