<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add Score</title>
  </head>
  <body>
    <h1>Submit Your Score</h1>

    <form id="scoreForm">
      <label for="nick">Nick:</label>
      <input type="text" id="nick" required />
      <input type="hidden" id="token" />
      <input type="hidden" id="score" />
      <input type="hidden" id="attempts" />
      <button type="submit">Submit</button>
    </form>

    <script>
      // --- Pobranie tokenu i wyników z URL ---
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");
      const score = parseInt(params.get("score")) || 0;
      const attempts = parseInt(params.get("attempts")) || 0;

      if (!token) {
        alert("Brak tokenu! Nie możesz dodać wyniku.");
        document.getElementById("scoreForm").style.display = "none";
      } else {
        document.getElementById("token").value = token;
        document.getElementById("score").value = score;
        document.getElementById("attempts").value = attempts;
      }

      document
        .getElementById("scoreForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const nick = document.getElementById("nick").value.trim();
          if (!nick) return alert("Podaj nick!");

          // --- POST do Supabase ---
          const response = await fetch(
            "https://fkxkcrkmpcxlsvuswdct.supabase.co/rest/v1/scores",
            {
              method: "POST",
              headers: {
                apikey: "TWÓJ_SUPABASE_ANON_KEY",
                Authorization: "Bearer TWÓJ_SUPABASE_ANON_KEY",
                "Content-Type": "application/json",
                Prefer: "return=representation",
              },
              body: JSON.stringify({
                playernick: nick,
                score: score,
                attempts: attempts,
                token: token,
              }),
            },
          );

          if (response.ok) {
            alert("Wynik dodany pomyślnie!");

            // --- Oznaczenie tokenu jako użytego ---
            await fetch(
              `https://fkxkcrkmpcxlsvuswdct.supabase.co/rest/v1/tokens?token=eq.${token}`,
              {
                method: "PATCH",
                headers: {
                  apikey: "TWÓJ_SUPABASE_ANON_KEY",
                  Authorization: "Bearer TWÓJ_SUPABASE_ANON_KEY",
                  "Content-Type": "application/json",
                  Prefer: "return=representation",
                },
                body: JSON.stringify({ used: true }),
              },
            );
          } else {
            const err = await response.json();
            alert("Błąd przy dodawaniu wyniku: " + JSON.stringify(err));
          }
        });
    </script>
  </body>
</html>
