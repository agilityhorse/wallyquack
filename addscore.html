<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Wally Quack - Submit Your Score</title>
  </head>
  <body>
    <h1>Wally Quack - Submit Your Score</h1>

    <form id="scoreForm">
      <label for="nick">Nickname:</label>
      <input type="text" id="nick" required />
      <input type="hidden" id="token" />
      <input type="hidden" id="score" />
      <input type="hidden" id="attempts" />
      <button type="submit">Submit</button>
    </form>

    <script>
      const ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZreGtjcmttcGN4bHN2dXN3ZGN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1NDA4ODksImV4cCI6MjA4NTExNjg4OX0.kamL2caQJQ1GGNHb-ftFi1L-4urZoqLfbO6WC7zfWjI";

      // --- Get token, score and attempts from URL ---
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");
      const score = parseInt(params.get("score")) || 0;
      const attempts = parseInt(params.get("attempts")) || 0;
      const pipes = parseInt(params.get("pipes")) || 0;

      if (!token) {
        alert("No token provided! You cannot submit a score.");
        document.getElementById("scoreForm").style.display = "none";
      } else {
        document.getElementById("token").value = token;
        document.getElementById("score").value = score;
        document.getElementById("attempts").value = attempts;
        document.getElementById("pipes").value = pipes;
      }

      document
        .getElementById("scoreForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const nick = document.getElementById("nick").value.trim();
          if (!nick) {
            alert("Please enter your nickname!");
            return;
          }

          try {
            // --- POST score ---
            const response = await fetch(
              "https://fkxkcrkmpcxlsvuswdct.supabase.co/rest/v1/scores",
              {
                method: "POST",
                headers: {
                  apikey: ANON_KEY,
                  Authorization: "Bearer " + ANON_KEY,
                  "Content-Type": "application/json",
                  Prefer: "return=representation",
                },
                body: JSON.stringify({
                  playernick: nick,
                  score: score,
                  attempts: attempts,
                  token: token,
                }),
              },
            );

            if (!response.ok) {
              const err = await response.json();
              alert("Error submitting score: " + JSON.stringify(err));
              return;
            }

            // --- Mark token as used ---
            const patchResp = await fetch(
              `https://fkxkcrkmpcxlsvuswdct.supabase.co/rest/v1/tokens?token=eq.${token}`,
              {
                method: "PATCH",
                headers: {
                  apikey: ANON_KEY,
                  Authorization: "Bearer " + ANON_KEY,
                  "Content-Type": "application/json",
                  Prefer: "return=representation",
                },
                body: JSON.stringify({ used: true }),
              },
            );

            if (!patchResp.ok) {
              console.warn("Failed to mark token as used.");
            }

            alert("Score submitted successfully! Returning to game...");

            // --- RETURN TO GAME ---
            window.location.href = "https://www.wallyquack.com/game/index.html";
          } catch (err) {
            console.error(err);
            alert("Network or API error. Check console for details.");
          }
        });
    </script>
  </body>
</html>
