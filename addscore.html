<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dodaj swój nick</title>
  </head>
  <body>
    <h2>Gratulacje! Wpisz swój nick do rankingu</h2>

    <form id="scoreForm">
      <label for="nick">Nick:</label>
      <input type="text" id="nick" name="nick" required />
      <input type="hidden" id="token" name="token" />
      <button type="submit">Wyślij</button>
    </form>

    <script>
      // --- Pobranie tokenu z URL ---
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");
      if (!token) {
        alert("Brak tokenu! Nie możesz dodać wyniku.");
        document.getElementById("scoreForm").style.display = "none";
      } else {
        document.getElementById("token").value = token;
      }

      document
        .getElementById("scoreForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const nick = document.getElementById("nick").value.trim();
          if (!nick) return alert("Podaj nick!");

          const score = parseInt(localStorage.getItem("score")) || 0; // jeśli chcesz, możesz przekazać score przez localStorage lub URL
          const attempts = parseInt(localStorage.getItem("attempts")) || 0;

          // --- Wyślij POST do Supabase ---
          const response = await fetch(
            "https://fkxkcrkmpcxlsvuswdct.supabase.co/rest/v1/scores",
            {
              method: "POST",
              headers: {
                apikey:
                  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZreGtjcmttcGN4bHN2dXN3ZGN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1NDA4ODksImV4cCI6MjA4NTExNjg4OX0.kamL2caQJQ1GGNHb-ftFi1L-4urZoqLfbO6WC7zfWjI",
                Authorization:
                  "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZreGtjcmttcGN4bHN2dXN3ZGN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1NDA4ODksImV4cCI6MjA4NTExNjg4OX0.kamL2caQJQ1GGNHb-ftFi1L-4urZoqLfbO6WC7zfWjI",
                "Content-Type": "application/json",
                Prefer: "return=representation",
              },
              body: JSON.stringify({
                playernick: nick,
                score: score,
                attempts: attempts,
                token: token,
              }),
            },
          );

          const result = await response.json();

          if (response.status === 201 || response.status === 200) {
            alert("Twój wynik został zapisany!");
            window.location.href = "https://wallyquack.com/leaderboard"; // lub otwórz w nowej karcie
          } else {
            alert("Błąd: " + JSON.stringify(result));
          }
        });
    </script>
  </body>
</html>
