    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wally Quack - Take a challenge!</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #181a17;
        color: #e6e6e6;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
      }

      .container {
        width: 320px;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }

      .logo {
        width: 100%;
        max-width: 320px;
        margin: 0 auto 20px auto;
      }

      .play-button {
        display: inline-block;
        padding: 12px 24px;
        background-color: #e6e617;
        color: #181a17;
        text-decoration: none;
        font-weight: bold;
        border-radius: 6px;
        margin-bottom: 20px;
        font-size: 16px;
      }

      .description {
        margin-bottom: 20px;
        font-size: 14px;
        line-height: 1.4;
      }

      .games-winners {
        font-size: 12px;
        color: #e6e6e6;
        margin-top: 20px;
      }

      /* Last finishers box */
      .last-finishers {
        margin-top: 20px;
        background: #222;
        padding: 10px;
        border-radius: 6px;
        font-size: 12px;
        text-align: left;
      }

      .last-finishers h3 {
        font-size: 14px;
        margin: 0 0 8px 0;
        color: #e6e617;
      }

      .last-finishers ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .last-finishers li {
        margin-bottom: 4px;
      }

      .games-winners a {
        color: #e6e617;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="images/logo1.png" alt="Logo gry" class="logo" />
      <a href="game/index.html" target="_blank" class="play-button"
        >Play Game</a
      >

      <div class="description">
        <b>Wally Quack</b> – an arcade skill game.<br />
        How good is your sense? Predict the movement and shoot down enemy.
      </div>

      <!-- Last finishers -->
      <div class="last-finishers">
        <h3>Best Pipes Bangers:</h3>
        <ul id="lastFinishersList">
          <li>Loading...</li>
        </ul>
      </div>

      <div class="games-winners">
        Created by
        <a href="https://x.com/agilityhorse" target="_blank">Agility Horse</a
        ><br />
        Music by
        <a href="https://www.youtube.com/@Kaczorskiii" target="_blank"
          >Kaczorski</a
        ><br />
        Presskit on
        <a
          href="https://drive.google.com/drive/folders/1xmwrFkC5pD2jlSBlvCMJRwSvNwDSEQ1u?usp=sharing"
          target="_blank"
          >Google Drive</a
        >
      </div>
    </div>

    <script>
      const ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZreGtjcmttcGN4bHN2dXN3ZGN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1NDA4ODksImV4cCI6MjA4NTExNjg4OX0.kamL2caQJQ1GGNHb-ftFi1L-4urZoqLfbO6WC7zfWjI";

      async function loadLastFinishers() {
        const listEl = document.getElementById("lastFinishersList");

        try {
          // Pobieramy playernick, score, attempts i pipes, sortując po pipes malejąco
          const res = await fetch(
            "https://fkxkcrkmpcxlsvuswdct.supabase.co/rest/v1/scores?select=playernick,score,attempts,pipes&order=pipes.desc&limit=5",
            {
              headers: {
                apikey: ANON_KEY,
                Authorization: "Bearer " + ANON_KEY,
              },
            },
          );

          if (!res.ok) throw new Error("Failed to fetch scores");

          const data = await res.json();
          listEl.innerHTML = "";

          if (data.length === 0) {
            listEl.innerHTML = "<li>No scores yet</li>";
            return;
          }

          // Wyświetlamy playernick, pipes i attempts
          data.forEach((item) => {
            const li = document.createElement("li");
            li.textContent = `${item.playernick} – ${item.pipes} pipes, ${item.attempts} attempts`;
            listEl.appendChild(li);
          });
        } catch (err) {
          console.error(err);
          listEl.innerHTML = "<li>Error loading scores</li>";
        }
      }

      loadLastFinishers();
    </script>
  </body>
</html>
