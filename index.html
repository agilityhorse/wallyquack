<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wally Quack - Take a challenge!</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #181a17;
        color: #e6e6e6;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
      }

      .container {
        width: 320px;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }

      .logo {
        width: 100%;
        max-width: 320px;
        margin: 0 auto 20px auto;
      }

      .play-button {
        display: inline-block;
        padding: 12px 24px;
        background-color: #e6e617;
        color: #181a17;
        text-decoration: none;
        font-weight: bold;
        border-radius: 6px;
        margin-bottom: 20px;
        font-size: 16px;
      }

      .description {
        margin-bottom: 20px;
        font-size: 14px;
        line-height: 1.4;
      }

      .games-winners {
        font-size: 12px;
        color: #e6e6e6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Logo -->
      <img src="images/logo1.png" alt="Logo gry" class="logo" />

      <!-- Przyciski gry -->
      <a href="game/index.html" target="_blank" class="play-button"
        >Play Game</a
      >

      <!-- Opis gry -->
      <div class="description">
        <b>Wally Quack</b> – an arcade skill game. How good is your sense?
        Predict the movement and shoot down enemy.
      </div>

      <!-- Games winners -->
      <div class="games-winners">Created by <a href="x.com/agilityhorse">Agility Horse</a>
      <br>Music by <a href="https://www.youtube.com/@Kaczorskiii">Kaczorski</div>
    </div>
  </body>
